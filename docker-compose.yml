services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong@Passw0rd"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrong@Passw0rd", "-Q", "SELECT 1", "-No"]
      interval: 10s
      timeout: 5s
      retries: 10

  glms-backend-api:
    build:
      context: .
      dockerfile: GLMS.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: "Server=sql-server-db;Database=GLMS;User Id=sa;Password=YourStrong@Passw0rd;TrustServerCertificate=True"
      JwtSettings__SecretKey: "glms-prod-secret-key-change-this-32chars!!"
      JwtSettings__Issuer: "glms-api"
      JwtSettings__Audience: "glms-web"
      Auth__AdminUsername: "admin"
      Auth__AdminPassword: "Admin@1234"
      Currency__BaseUrl: "https://v6.exchangerate-api.com/v6/"
      Currency__ApiKey: ""
    ports:
      - "5001:8080"
    depends_on:
      sql-server-db:
        condition: service_healthy

  glms-frontend-web:
    build:
      context: .
      dockerfile: GLMS.Web/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ApiBaseUrl: "http://glms-backend-api:8080"
      ApiPublicBaseUrl: "http://localhost:5001"
    ports:
      - "5000:8080"
    depends_on:
      - glms-backend-api

volumes:
  sqldata:
